    <!-- Inicialização do Firebase Auth e Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyInTcgD-cIuuXDBUdvITYBO1aQD4Jmh4",
            authDomain: "calculadora-f18.firebaseapp.com",
            databaseURL: "https://calculadora-f18-default-rtdb.firebaseio.com",
            projectId: "calculadora-f18",
            storageBucket: "calculadora-f18.firebasestorage.app",
            messagingSenderId: "541122272700",
            appId: "1:541122272700:web:f88948002a3ba5daeb9fb9",
            measurementId: "G-NW4F8ZB8DD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        try { getAnalytics(app); } catch(e) {}

        // BLINDAGEM DE ACESSO E BUSCA DO NOME DA CLÍNICA
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'auth.html';
            } else {
                const topRow = document.querySelector('.header-top-row');
                
                // Cria a div onde o nome da clínica será exibido
                let nomeClinicaDiv = document.getElementById('nomeClinicaExibicao');
                if (!nomeClinicaDiv && topRow) {
                    nomeClinicaDiv = document.createElement('div');
                    nomeClinicaDiv.id = 'nomeClinicaExibicao';
                    // Estilo para ficar na linha de cima, onde estava o "em branco" em vermelho
                    nomeClinicaDiv.style.cssText = "font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 5px; width: 100%;";
                    topRow.parentNode.insertBefore(nomeClinicaDiv, topRow);
                }

                // Busca o nome da clínica no banco de dados
                try {
                    const userRef = ref(db, 'usuarios/' + user.uid);
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        if (dados.nomeClinica && nomeClinicaDiv) {
                            nomeClinicaDiv.innerText = dados.nomeClinica;
                        } else if (dados.nome && nomeClinicaDiv) {
                            // Fallback: se não tiver nomeClinica, usa o nome comum (para usuários antigos)
                            nomeClinicaDiv.innerText = dados.nome;
                        }
                    }
                } catch (e) {
                    console.error("Erro ao buscar nome da clínica:", e);
                }

                const topRowTitle = document.querySelector('.header-top-row h2');
                if (topRowTitle) {
                    topRowTitle.innerHTML = `Lista de Pacientes do Dia - <span style="color:#3b82f6; font-size: 16px;">${user.email}</span>`;
                }
            }
        });

        window.fazerLogoutFirebase = async function() {
            await signOut(auth);
            sessionStorage.clear();
            window.location.href = 'auth.html';
        };

        window.fbDb = db;
        window.fbRef = ref;
        window.fbGet = get;
        window.fbSet = set;
        window.fbUpdate = update;
        window.fbOnValue = onValue;
        
        if (typeof iniciarEscutaTempoReal === 'function') {
            iniciarEscutaTempoReal();
        }
    </script>
